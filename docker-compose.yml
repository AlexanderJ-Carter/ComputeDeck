# ComputeDeck 控制面（本机 / 单机部署）
# 用法：
#   1. cp -n config/examples/cluster.example.json config/local/cluster.json
#   2. cp -n config/examples/nodes.example.json config/local/nodes.json
#   3. cp -n .env.example .env   # 可选
#   4. 准备 SSH 私钥到 deploy/ssh/（或设 COMPUTEDECK_SSH_DIR）
#   5. docker compose up -d --build
#      # 或拉发版镜像：COMPUTEDECK_IMAGE=ghcr.io/alexanderj-carter/computedeck:X.Y.Z docker compose up -d
#   6. 浏览器 http://127.0.0.1:8787 （生产务必开鉴权）

services:
  control:
    build:
      context: .
      args:
        # 本地 build 也写入正确的镜像版本标签；发版流水线由 release.yml 覆盖。
        VERSION: ${COMPUTEDECK_VERSION:-dev}
    image: ${COMPUTEDECK_IMAGE:-ghcr.io/alexanderj-carter/computedeck:latest}
    container_name: computedeck-control
    ports:
      # 默认只发布到本机回环；需要局域网访问时设 UI_BIND=0.0.0.0 并先开启鉴权。
      - "${UI_BIND:-127.0.0.1}:${UI_PORT:-8787}:8787"
    volumes:
      - ./config/local:/app/config/local
      - ./state:/app/state
      - ${COMPUTEDECK_SSH_DIR:-./deploy/ssh}:/root/.ssh:ro
    environment:
      GPU_CONTROL_UI_HOST: "0.0.0.0"
      GPU_CONTROL_UI_PORT: "8787"
      # 本机 HTTP 默认 0；反代 HTTPS 时设 GPU_CONTROL_UI_SECURE=1
      GPU_CONTROL_UI_SECURE: "${GPU_CONTROL_UI_SECURE:-0}"
    restart: unless-stopped
