[project]
name = "gpu-control"
version = "1.3.5"
description = "ComputeDeck — multi-node compute control plane (Web / CLI / MCP)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
authors = [
  { name = "黄皓宇", email = "2253940186@qq.com" },
]
keywords = [
  "gpu",
  "cluster",
  "ansible",
  "mcp",
  "vllm",
  "ray",
  "control-plane",
  "computedeck",
]
dependencies = [
  "ansible>=9.0.0",
  "paramiko>=3.0.0",
  "json-repair>=0.30.0",
  "pydantic>=2.6.0",
]

[project.optional-dependencies]
mcp = ["mcp>=2.0.0"]
docs = ["mkdocs>=1.6.0", "mkdocs-material>=9.5.0", "pymdown-extensions>=10.0.0"]
models-worker = ["huggingface_hub>=0.24.0", "modelscope>=1.18.0"]
dev = ["ruff>=0.6.0"]

[project.urls]
Homepage = "https://github.com/AlexanderJ-Carter/ComputeDeck"
Repository = "https://github.com/AlexanderJ-Carter/ComputeDeck"
Issues = "https://github.com/AlexanderJ-Carter/ComputeDeck/issues"
Changelog = "https://github.com/AlexanderJ-Carter/ComputeDeck/blob/main/CHANGELOG.md"
Documentation = "https://github.com/AlexanderJ-Carter/ComputeDeck/tree/main/docs"
Security = "https://github.com/AlexanderJ-Carter/ComputeDeck/blob/main/SECURITY.md"

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "web/static", "demo", "state", "snapshots"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
