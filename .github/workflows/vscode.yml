name: VS Code extension

# 扩展变更时打包 VSIX 并上传 workflow artifact。
# tagged release 的 VSIX 由 release.yml 的 vscode job 统一附加，
# 避免 tag push 被 paths 过滤吞掉导致 Release 缺附件。
on:
  push:
    branches: [main]
    paths:
      - "extensions/vscode/**"
      - ".github/workflows/vscode.yml"
  pull_request:
    paths:
      - "extensions/vscode/**"
      - ".github/workflows/vscode.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vscode-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check
        working-directory: extensions/vscode
        run: node --check extension.js

      - name: Package VSIX
        working-directory: extensions/vscode
        run: |
          npx --yes @vscode/vsce package --allow-missing-repository
          ls -lh *.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: computedeck-vscode
          path: extensions/vscode/*.vsix
          if-no-files-found: error
