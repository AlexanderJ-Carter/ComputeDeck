name: ci

on:
  push:
    branches: [main]
  pull_request:

# main 连续 push 时不重叠跑重量级 Docker 构建。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Create venv and install
        run: |
          uv venv .venv
          uv pip install -r requirements.txt
          uv pip install -r requirements-docs.txt

      - name: Offline checks
        run: ./scripts/check.sh

      - name: Build docs
        run: .venv/bin/mkdocs build --strict

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build control image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: computedeck:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke container health
        run: |
          docker run -d --name computedeck-ci -p 8787:8787 computedeck:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/api/health >/dev/null; then
              echo "health ok"
              docker logs computedeck-ci | tail -20
              docker rm -f computedeck-ci
              exit 0
            fi
            sleep 1
          done
          docker logs computedeck-ci || true
          docker rm -f computedeck-ci || true
          exit 1
