name: Deploy site to GitHub Pages

# 同一个 Pages 站点：
#   /        产品演示页（demo/）
#   /docs/   产品文档（MkDocs）
# 手册在控制面 /help 也有一份；这里只是给外部访问的静态副本。

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install docs dependencies
        run: pip install -r requirements-docs.txt

      - name: Build docs
        run: mkdocs build --strict -d _site/docs

      - name: Add demo site
        run: |
          cp -R demo/. _site/
          if [ -f demo/CNAME ]; then cp demo/CNAME _site/CNAME; fi
          test -f _site/index.html
          test -f _site/docs/index.html

      - name: Check static links
        run: python scripts/check_site.py _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
