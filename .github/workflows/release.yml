name: Release

# 打 annotated tag vX.Y.Z 并推送后：
# 1) 校验版本 + check.sh + MkDocs
# 2) 用 CHANGELOG 建 GitHub Release
# 3) 构建并推送控制面镜像到 GHCR（含 OCI 标签 / SBOM / provenance）
# 不发布 PyPI / npm（uv package=false，仓库即控制面）。
#
# 本地准备：python scripts/prepare_release.py --bump patch --apply --check

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

# 同一 tag 重跑时排队，不并发创建 Release / 推同一镜像 tag。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "tag 须为 vX.Y.Z 或预发布后缀，收到: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Create venv and install
        run: |
          uv venv .venv
          uv pip install -r requirements.txt
          uv pip install -r requirements-docs.txt

      - name: Verify version files
        run: .venv/bin/python scripts/release_notes.py --check "${{ steps.ver.outputs.version }}"

      - name: Offline checks
        run: ./scripts/check.sh

      - name: Build docs
        run: .venv/bin/mkdocs build --strict

      - name: Extract release notes
        run: |
          .venv/bin/python scripts/release_notes.py "${{ steps.ver.outputs.version }}" \
            > /tmp/release-notes.md
          {
            echo "## ComputeDeck ${{ steps.ver.outputs.tag }}"
            echo
            echo "命令行仍为 \`gpu-control\`。主产物是控制面容器；不发 PyPI / npm。"
            echo
            echo "### 安装"
            echo
            echo "- 源码：附件 \`computedeck-${{ steps.ver.outputs.version }}.tar.gz\`，或 \`git clone\` 后 \`uv pip install -r requirements.txt\`"
            echo "- 容器：\`docker pull ghcr.io/alexanderj-carter/computedeck:${{ steps.ver.outputs.version }}\`"
            echo "- Compose：复制 \`.env.example\` → \`.env\` 后 \`docker compose up -d\`"
            echo "- VS Code：附件 \`computedeck-vscode-${{ steps.ver.outputs.version }}.vsix\`（\`code --install-extension\`）"
            echo "- MCP：\`uv pip install -r requirements-mcp.txt\` · 示例 \`config/examples/mcp.*\`"
            echo "- 展板：https://compute.alexander.xin/"
            echo
            echo "官方包已 Public。fork / 新 Package 若匿名 401：Packages → 设置 → Public。"
            echo
            cat /tmp/release-notes.md
          } > /tmp/github-release.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXTRA=()
          if [[ "${{ steps.ver.outputs.prerelease }}" == "true" ]]; then
            EXTRA+=(--prerelease)
            TITLE="ComputeDeck ${{ steps.ver.outputs.tag }}（先导测试版）"
          else
            TITLE="ComputeDeck ${{ steps.ver.outputs.tag }}"
          fi
          gh release create "${{ steps.ver.outputs.tag }}" \
            --title "$TITLE" \
            --notes-file /tmp/github-release.md \
            --verify-tag \
            "${EXTRA[@]}"

      - name: Attach source archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver="${{ steps.ver.outputs.version }}"
          git archive --format=tar.gz --prefix="computedeck-$ver/" \
            -o "/tmp/computedeck-$ver.tar.gz" HEAD
          ( cd /tmp && sha256sum "computedeck-$ver.tar.gz" > "computedeck-$ver.tar.gz.sha256" )
          gh release upload "${GITHUB_REF_NAME}" \
            "/tmp/computedeck-$ver.tar.gz" \
            "/tmp/computedeck-$ver.tar.gz.sha256" \
            --clobber

  vscode:
    name: VS Code VSIX
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check
        working-directory: extensions/vscode
        run: node --check extension.js

      - name: Package VSIX
        working-directory: extensions/vscode
        run: |
          npx --yes @vscode/vsce package --allow-missing-repository
          ls -lh *.vsix

      - name: Attach VSIX to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          file="$(ls extensions/vscode/*.vsix | head -n 1)"
          test -n "$file"
          gh release upload "$tag" "$file" --clobber
          echo "attached $file to $tag"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: computedeck-vscode
          path: extensions/vscode/*.vsix
          if-no-files-found: error

  image:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/computedeck
          tags: |
            type=raw,value=${{ needs.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.version }},enable=${{ needs.release.outputs.prerelease != 'true' }}
            type=raw,value=latest,enable=${{ needs.release.outputs.prerelease != 'true' }}
          labels: |
            org.opencontainers.image.title=ComputeDeck
            org.opencontainers.image.description=Multi-node GPU control plane (Web / CLI / MCP)
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build date
        id: date
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.date.outputs.value }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### GHCR"
            echo "- \`ghcr.io/${{ github.repository_owner }}/computedeck:${{ needs.release.outputs.version }}\`"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
            echo
            echo "官方包已 Public；fork 新包名首次推送后请确认 Packages 可见性。"
          } >> "$GITHUB_STEP_SUMMARY"
