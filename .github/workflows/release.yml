name: Release

# 打 annotated tag vX.Y.Z 并推送后：
# 1) 校验版本 + check.sh + MkDocs
# 2) 用 CHANGELOG 建 GitHub Release
# 3) 构建并推送控制面镜像到 GHCR
# 暂不发布 PyPI（uv package=false，仓库即控制面）。

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "tag 须为 vX.Y.Z，收到: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Create venv and install
        run: |
          uv venv .venv
          uv pip install -r requirements.txt
          uv pip install -r requirements-docs.txt

      - name: Verify version files
        run: .venv/bin/python scripts/release_notes.py --check "${{ steps.ver.outputs.version }}"

      - name: Offline checks
        run: ./scripts/check.sh

      - name: Build docs
        run: .venv/bin/mkdocs build --strict

      - name: Extract release notes
        run: |
          .venv/bin/python scripts/release_notes.py "${{ steps.ver.outputs.version }}" \
            > /tmp/release-notes.md
          {
            echo "## ComputeDeck ${{ steps.ver.outputs.tag }}"
            echo
            echo "命令行仍为 \`gpu-control\`。"
            echo
            echo "### 安装"
            echo
            echo "- 源码：克隆后 \`uv pip install -r requirements.txt\`（暂不发 PyPI）"
            echo "- 容器：\`docker pull ghcr.io/alexanderj-carter/computedeck:${{ steps.ver.outputs.version }}\`"
            echo "- 展板：https://alexanderj-carter.github.io/ComputeDeck/"
            echo
            cat /tmp/release-notes.md
          } > /tmp/github-release.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            --title "ComputeDeck ${{ steps.ver.outputs.tag }}" \
            --notes-file /tmp/github-release.md \
            --verify-tag

  image:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/computedeck
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
