name: Release

# 打 annotated tag vX.Y.Z 并推送后：
# 1) 校验版本 + check.sh + MkDocs
# 2) 用 CHANGELOG 建 GitHub Release
# 3) 构建并推送控制面镜像到 GHCR（含 OCI 标签 / SBOM / provenance）
# 不发布 PyPI / npm（uv package=false，仓库即控制面）。
#
# 本地准备：python scripts/prepare_release.py --bump patch --apply --check

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "tag 须为 vX.Y.Z，收到: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Create venv and install
        run: |
          uv venv .venv
          uv pip install -r requirements.txt
          uv pip install -r requirements-docs.txt

      - name: Verify version files
        run: .venv/bin/python scripts/release_notes.py --check "${{ steps.ver.outputs.version }}"

      - name: Offline checks
        run: ./scripts/check.sh

      - name: Build docs
        run: .venv/bin/mkdocs build --strict

      - name: Extract release notes
        run: |
          .venv/bin/python scripts/release_notes.py "${{ steps.ver.outputs.version }}" \
            > /tmp/release-notes.md
          {
            echo "## ComputeDeck ${{ steps.ver.outputs.tag }}"
            echo
            echo "命令行仍为 \`gpu-control\`。主产物是控制面容器；不发 PyPI / npm。"
            echo
            echo "### 安装"
            echo
            echo "- 源码：\`git clone\` 后 \`uv pip install -r requirements.txt\`"
            echo "- 容器：\`docker pull ghcr.io/alexanderj-carter/computedeck:${{ steps.ver.outputs.version }}\`"
            echo "- Compose：复制 \`.env.example\` → \`.env\` 后 \`docker compose up -d\`"
            echo "- MCP：\`uv pip install -r requirements-mcp.txt\` · 示例 \`config/examples/mcp.*\`"
            echo "- 展板：https://alexanderj-carter.github.io/ComputeDeck/"
            echo
            echo "官方包已 Public。fork / 新 Package 若匿名 401：Packages → 设置 → Public。"
            echo
            cat /tmp/release-notes.md
          } > /tmp/github-release.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            --title "ComputeDeck ${{ steps.ver.outputs.tag }}" \
            --notes-file /tmp/github-release.md \
            --verify-tag

  image:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/computedeck
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=ComputeDeck
            org.opencontainers.image.description=Multi-node GPU control plane (Web / CLI / MCP)
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Build date
        id: date
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.date.outputs.value }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### GHCR"
            echo "- \`ghcr.io/${{ github.repository_owner }}/computedeck:${{ needs.release.outputs.version }}\`"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
            echo
            echo "官方包已 Public；fork 新包名首次推送后请确认 Packages 可见性。"
          } >> "$GITHUB_STEP_SUMMARY"
