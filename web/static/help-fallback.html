<!DOCTYPE html>

    body { font-family: var(--font-sans); max-width: 720px; margin: 40px auto; padding: 0 16px; line-height: 1.6; color: var(--ink); background: var(--bg); }

  <h1>手册尚未构建</h1>

  <pre>uv pip install -r requirements-docs.txt
gpu-control docs build
# 然后刷新 /help/</pre>
  <p>也可先看这些入口：</p>
  <ul>
    <li><a href="/api/docs">API / Swagger 试调</a></li>

  </ul>
