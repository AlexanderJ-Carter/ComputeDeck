site_name: ComputeDeck
site_description: ComputeDeck — 多节点算力控制面（命令行 gpu-control）
# 手册同时发布到控制面 /help 和 Pages 的 /docs/；GitHub Pages 根路径是 demo/ 演示页。
site_url: https://compute.alexander.xin/docs/
repo_url: https://github.com/AlexanderJ-Carter/ComputeDeck
repo_name: AlexanderJ-Carter/ComputeDeck
docs_dir: docs
site_dir: web/static/help
strict: false

theme:
  name: material
  language: zh
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: 切换深色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: 切换浅色
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search:
      lang: zh

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

extra:
  generator: false

nav:
  - 开始:
      - 文档首页: index.md
      - 产品故事: 产品故事.md
      - 开始使用: 开始使用.md
      - 配置指南: 配置指南.md
      - 部署总览: 部署总览.md
      - 上手手册: 手册.md
  - 生产与运维:
      - 生产部署: 生产部署.md
      - 安全加固: 安全加固.md
      - 接入拓扑与鉴权: 接入拓扑与鉴权.md
      - 升级与备份: 升级与备份.md
      - 故障排查: 故障排查.md
      - 配置参考: 配置参考.md
  - 进阶:
      - 分布式与推理: 分布式与推理.md
      - 高可用与负载均衡: 高可用与负载均衡.md
      - 入口分层与 nginx: 入口分层与nginx.md
      - 远程接入: 远程接入.md
  - 接入:
      - AI / MCP: ai-接入.md
      - VS Code 插件: vscode插件.md
  - 参考:
      - 性能与基准: 性能与基准.md
      - HTTP API: api/index.md
      - OpenAPI / Swagger: api/openapi.md
      - 打包与发布: 打包与发布.md
      - 发布与账号: 发布与账号.md
      - 演示页域名: 自定义域名.md
  - 开发:
      - 容器部署: develop/docker.md
      - Docstring 规范: develop/docstrings.md
      - 仓库布局: develop/layout.md
      - 校验与 CI: develop/ci.md
