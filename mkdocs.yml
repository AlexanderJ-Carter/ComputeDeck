site_name: ComputeDeck
site_description: ComputeDeck — 多节点 GPU 控制面（命令行 gpu-control）
site_url: https://alexanderj-carter.github.io/ComputeDeck/
repo_url: https://github.com/AlexanderJ-Carter/ComputeDeck
repo_name: AlexanderJ-Carter/ComputeDeck
docs_dir: docs
site_dir: web/static/help
strict: false

theme:
  name: material
  language: zh
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: 切换深色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: 切换浅色
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search:
      lang: zh

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

extra:
  generator: false

nav:
  - 首页: index.md
  - 上手与运维: 手册.md
  - 产品化:
      - 生产部署: 生产部署.md
      - 安全加固: 安全加固.md
      - 升级与备份: 升级与备份.md
      - 故障排查: 故障排查.md
      - 配置参考: 配置参考.md
  - 分布式与推理: 分布式与推理.md
  - 高可用与负载均衡: 高可用与负载均衡.md
  - AI / MCP 接入: ai-接入.md
  - HTTP API:
      - 概览: api/index.md
      - OpenAPI / Swagger: api/openapi.md
  - 开发约定:
      - Docstring 规范: develop/docstrings.md
      - 仓库布局: develop/layout.md
      - 校验与 CI: develop/ci.md
