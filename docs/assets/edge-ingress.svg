<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img">
  <title>Edge ingress</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="360" rx="16" fill="url(#bg)"/>
  <text x="32" y="40" font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Inference ingress · Edge LB</text>
  <text x="32" y="62" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#64748b">round_robin / least_conn · retries + cooldown · /_gpu_control/health</text>
  <g filter="url(#shadow)"><rect x="40" y="130" width="140" height="88" rx="12" fill="#fff" stroke="#cbd5e1"/></g>
  <text x="110" y="168" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#334155">Client</text>
  <text x="110" y="190" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#64748b">App · SDK · curl</text>
  <g filter="url(#shadow)"><rect x="260" y="110" width="200" height="128" rx="12" fill="#0d9488"/></g>
  <text x="360" y="148" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#fff">Edge LB</text>
  <text x="360" y="172" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#ccfbf1">:18080</text>
  <text x="360" y="198" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#99f6e4">optional TLS</text>
  <text x="360" y="218" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#99f6e4">reads endpoint_health</text>
  <g filter="url(#shadow)"><rect x="560" y="88" width="360" height="172" rx="12" fill="#fff" stroke="#fdba74"/></g>
  <text x="740" y="116" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#9a3412">Healthy endpoint pool</text>
  <rect x="584" y="136" width="100" height="88" rx="10" fill="#fff7ed" stroke="#fb923c"/>
  <text x="634" y="172" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#9a3412">gpu-1</text>
  <text x="634" y="194" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#c2410c">:8000</text>
  <rect x="700" y="136" width="100" height="88" rx="10" fill="#fff7ed" stroke="#fb923c"/>
  <text x="750" y="172" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#9a3412">gpu-2</text>
  <text x="750" y="194" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#c2410c">:8000</text>
  <rect x="816" y="136" width="80" height="88" rx="10" fill="#fff7ed" stroke="#fb923c"/>
  <text x="856" y="172" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#9a3412">…</text>
  <text x="856" y="194" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#c2410c">:8000+</text>
  <g filter="url(#shadow)"><rect x="260" y="280" width="200" height="52" rx="10" fill="#fff" stroke="#a5b4fc"/></g>
  <text x="360" y="302" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#3730a3">optional AI Gateway / LiteLLM</text>
  <text x="360" y="320" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#6366f1">:4000</text>
  <path d="M180 174 H250" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M460 174 H552" stroke="#0d9488" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M360 238 V276" stroke="#6366f1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
