---
- name: Manage a registered GPU job (process or docker)
  hosts: gpu_workers
  gather_facts: false

  vars:
    job_action: status
    runtime: process
    job_python: python3
    job_script: ""
    job_extra_args: []
    job_env: {}
    job_kind: service
    distributed: false
    nproc_per_node: 1
    master_port: 29500
    docker_image: ""
    docker_name: ""
    docker_gpus: all
    docker_ports: []
    docker_volumes: []
    docker_command: []
    docker_env: {}
    job_name: "{{ (job_env | default({})).get('GPU_CONTROL_JOB_NAME') or 'job' }}"
    job_runtime: "{{ (job_env | default({})).get('GPU_CONTROL_JOB_RUNTIME') or ('/tmp/gpu-control-jobs/' ~ job_name) }}"
    dist_hostfile: "{{ job_runtime ~ '/hostfile' }}"

  tasks:
    - name: Validate action
      ansible.builtin.assert:
        that:
          - job_action in ['start', 'stop', 'restart', 'status', 'wait']
          - runtime in ['process', 'docker']

    - name: Resolve distributed topology
      when: distributed | bool
      ansible.builtin.set_fact:
        dist_nnodes: "{{ ansible_play_hosts_all | length }}"
        dist_node_rank: "{{ ansible_play_hosts_all.index(inventory_hostname) }}"
        dist_master_addr: "{{ hostvars[ansible_play_hosts_all[0]].ansible_host | default(ansible_play_hosts_all[0]) }}"
        dist_master_port: "{{ master_port | default(29500) }}"
        dist_nproc: "{{ nproc_per_node | default(1) }}"

    - name: Build distributed env export
      when: distributed | bool
      ansible.builtin.set_fact:
        dist_export: >-
          export NNODES={{ dist_nnodes }};
          export NODE_RANK={{ dist_node_rank }};
          export MASTER_ADDR={{ dist_master_addr }};
          export MASTER_PORT={{ dist_master_port }};
          export NPROC_PER_NODE={{ dist_nproc }};
          export GPU_CONTROL_NNODES={{ dist_nnodes }};
          export GPU_CONTROL_NODE_RANK={{ dist_node_rank }};
          export GPU_CONTROL_MASTER_ADDR={{ dist_master_addr }};
          export GPU_CONTROL_MASTER_PORT={{ dist_master_port }};
          export GPU_CONTROL_NPROC_PER_NODE={{ dist_nproc }};
          export HOSTFILE={{ dist_hostfile }};
          export FORCE_TORCHRUN=${FORCE_TORCHRUN:-1};
        dist_docker_env_flags: >-
          -e NNODES={{ dist_nnodes }}
          -e NODE_RANK={{ dist_node_rank }}
          -e MASTER_ADDR={{ dist_master_addr }}
          -e MASTER_PORT={{ dist_master_port }}
          -e NPROC_PER_NODE={{ dist_nproc }}
          -e FORCE_TORCHRUN=1

    - name: Ensure distributed runtime directory
      when: distributed | bool
      ansible.builtin.file:
        path: "{{ job_runtime }}"
        state: directory
        mode: "0755"

    - name: Write distributed hostfile (DeepSpeed / launchers)
      when: distributed | bool
      ansible.builtin.copy:
        dest: "{{ dist_hostfile }}"
        mode: "0644"
        content: "{% for h in ansible_play_hosts_all %}{{ hostvars[h].ansible_host | default(h) }} slots={{ nproc_per_node | default(1) }}\n{% endfor %}"

    - name: Clear distributed env when disabled
      when: not (distributed | bool)
      ansible.builtin.set_fact:
        dist_export: ""
        dist_docker_env_flags: ""

    - name: Build env prefix
      ansible.builtin.set_fact:
        env_prefix: >-
          {% for k, v in (job_env | default({})).items() %}{{ k }}={{ v | quote }} {% endfor %}

    - name: Process job command
      when: runtime == 'process'
      ansible.builtin.set_fact:
        remote_cmd: >-
          {{ dist_export }}{{ env_prefix }}{{ job_python }} {{ job_script }} {{ job_action }}
          {{ job_extra_args | join(' ') }}

    - name: Docker availability
      when: runtime == 'docker'
      ansible.builtin.raw: command -v docker
      register: docker_bin
      changed_when: false
      failed_when: false

    - name: Fail when docker missing
      when: runtime == 'docker' and docker_bin.rc != 0
      ansible.builtin.fail:
        msg: "节点未安装 docker；runtime=docker 不可用"

    - name: Docker run flags
      when: runtime == 'docker'
      ansible.builtin.set_fact:
        docker_port_flags: "{% for p in docker_ports %} -p {{ p }}{% endfor %}"
        docker_vol_flags: "{% for v in docker_volumes %} -v {{ v }}{% endfor %}"
        docker_env_flags: "{% for k, v in (docker_env | default({})).items() %} -e {{ k }}={{ v | quote }}{% endfor %}"
        docker_cmd_flags: "{{ docker_command | join(' ') }}"

    - name: Docker start/restart command
      when: runtime == 'docker' and job_action in ['start', 'restart']
      ansible.builtin.set_fact:
        remote_cmd: >-
          docker rm -f {{ docker_name }} >/dev/null 2>&1 || true;
          docker run -d --restart unless-stopped
          --name {{ docker_name }}
          --gpus {{ docker_gpus }}
          {{ docker_port_flags }}
          {{ docker_vol_flags }}
          {{ docker_env_flags }}
          {{ dist_docker_env_flags }}
          {{ docker_image }}
          {{ docker_cmd_flags }}

    - name: Docker stop command
      when: runtime == 'docker' and job_action == 'stop'
      ansible.builtin.set_fact:
        remote_cmd: docker rm -f {{ docker_name }}

    - name: Docker status command
      when: runtime == 'docker' and job_action == 'status'
      ansible.builtin.set_fact:
        remote_cmd: >-
          docker inspect -f '{{ '{{' }}.State.Status{{ '}}' }}' {{ docker_name }}
          || (echo missing; exit 1)

    - name: Docker wait command
      when: runtime == 'docker' and job_action == 'wait'
      ansible.builtin.set_fact:
        remote_cmd: >-
          for i in $(seq 1 60); do
            st=$(docker inspect -f '{{ '{{' }}.State.Status{{ '}}' }}' {{ docker_name }} 2>/dev/null || true);
            if [ "$st" = "running" ]; then echo ready; exit 0; fi;
            sleep 2;
          done;
          echo timeout; exit 1

    - name: Run job manager
      ansible.builtin.raw: "{{ remote_cmd }}"
      register: job_result
      changed_when: job_action in ['start', 'stop', 'restart'] and job_result.rc == 0
      failed_when: >-
        job_result.rc != 0
        and not (job_action == 'status' and job_result.rc == 1)

    - name: Display result
      ansible.builtin.debug:
        var: job_result.stdout_lines
