---
- name: Probe cross-node TCP connectivity
  hosts: gpu_workers
  gather_facts: false

  vars:
    peer_map: {}
    probe_port: 22
    probe_timeout: 3

  tasks:
    - name: Probe peers from this node
      ansible.builtin.shell: |
        python3 -c '
        import json, socket, sys
        peers = json.loads(sys.argv[1])
        port = int(sys.argv[2])
        timeout = float(sys.argv[3])
        self_name = sys.argv[4]
        rows = []
        for name, host in peers.items():
            if name == self_name:
                continue
            ok = False
            err = ""
            try:
                with socket.create_connection((host, port), timeout=timeout):
                    ok = True
            except OSError as exc:
                err = str(exc)
            rows.append({
                "from": self_name,
                "to": name,
                "host": host,
                "port": port,
                "ok": ok,
                "error": err,
            })
        print(json.dumps(rows, ensure_ascii=False))
        ' '{{ peer_map | to_json }}' '{{ probe_port }}' '{{ probe_timeout }}' '{{ inventory_hostname }}'
      register: probe_result
      changed_when: false

    - name: Create local state directory
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../state"
        state: directory
        mode: "0755"
      delegate_to: localhost
      run_once: true

    - name: Save probe rows locally
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../state/probe-{{ inventory_hostname }}.json"
        content: "{{ probe_result.stdout | default('[]') }}"
        mode: "0644"
      delegate_to: localhost
