---
- name: Collect GPU resource snapshots
  hosts: gpu_workers
  gather_facts: false
  # 单台节点不可达不应让整批采集失败：可达节点仍更新快照，
  # 不可达节点由 parse_resources.py 按 collected_at 标记 stale。
  ignore_unreachable: true

  tasks:
    - name: Query GPU information
      ansible.builtin.raw: >-
        nvidia-smi
        --query-gpu=index,uuid,memory.total,memory.used,utilization.gpu
        --format=csv,noheader,nounits
      register: gpu_info
      changed_when: false

    - name: Query GPU processes
      ansible.builtin.raw: >-
        nvidia-smi
        --query-compute-apps=gpu_uuid,pid,process_name,used_gpu_memory
        --format=csv,noheader,nounits || true
      register: process_info
      changed_when: false
      failed_when: false

    - name: Create local snapshot directory
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../snapshots"
        state: directory
        mode: "0755"
      delegate_to: localhost
      run_once: true

    - name: Save resource snapshot
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../snapshots/{{ inventory_hostname }}.json"
        content: "{{ snapshot | to_nice_json }}"
        mode: "0644"
      vars:
        snapshot:
          node: "{{ inventory_hostname }}"
          collected_at: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
          gpu_rows: "{{ gpu_info.stdout_lines | default([]) | select('truthy') | list }}"
          process_rows: "{{ process_info.stdout_lines | default([]) | select('truthy') | list }}"
      # 不可达主机不会执行 raw 任务；不要为它写一个“0 卡且刚采集”的假快照。
      when: gpu_info is defined and (gpu_info.rc | default(1)) == 0
      delegate_to: localhost
